vo=gpu-next
hwdec=auto

image-display-duration=inf
keep-open=yes

autofit-larger=100%x100%
panscan=1.0
cursor-autohide=3000
force-window=no

autocreate-playlist=same
directory-mode=ignore
loop-file=inf
loop-playlist=inf
reset-on-next-file=window-scale,video-zoom,video-rotate,video-align-x,video-align-y,video-aspect-override,video-pan-x,video-pan-y,panscan

osd-level=1
no-osd-bar
osd-duration=3000

hdr-compute-peak=no
video-sync=display-resample
interpolation=yes

[image-settings]
profile-cond=p["current-tracks/video/image"]
profile-restore=copy-equal
vo=wlshm
osc=no
force-window=no
osd-level=0
stop-screensaver=no
video-recenter=yes

[video-settings]
profile-cond=duration and duration > 0 and p["current-tracks/video"] and not p["current-tracks/video"].image
profile-restore=copy-equal
vo=gpu-next
taskbar-progress=yes

volume=100
volume-max=150
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]

screenshot-directory=~/Pictures/mpv-screenshots
screenshot-template=mpv_%F_%P_%n
screenshot-format=png
screenshot-png-compression=7
